<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Storyteller Trainer | Clockipedia
    </title>

    <link
        rel="stylesheet"
        href="/css/style-global.css"
    >

    <link
        rel="stylesheet"
        href="/css/storyteller-trainer.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>


<body>


<div id="sidebar-container"></div>


<main class="trainer">


    <!-- ==========================================
         Game Board
    =========================================== -->

    <section class="trainer-board">


        <!-- ======================================
             Title
        ======================================= -->

        <header class="trainer-title">

            <span class="trainer-title-small">
                TROUBLE BREWING
            </span>

            <h1>
                Storyteller Trainer
            </h1>

            <span
                id="trainer-instruction"
                class="trainer-instruction"
            >
                Select characters to begin
            </span>

        </header>



        <!-- ======================================
             Phase
        ======================================= -->

        <div class="trainer-phase">

            <span
                id="phase-number"
                class="phase-number"
            >
                SETUP
            </span>

            <strong
                id="phase-name"
                class="phase-name"
            >
                Select Characters
            </strong>

        </div>



        <!-- ======================================
             Player Area
        ======================================= -->

        <div
            id="player-area"
            class="player-area"
        >


            <!-- ==================================
                 Decorative Rings
            =================================== -->

            <div class="board-ring board-ring-outer"></div>

            <div class="board-ring board-ring-middle"></div>

            <div class="board-ring board-ring-inner"></div>

<div class="ring-ornaments">
    <span class="ring-ornament ornament-top"></span>
    <span class="ring-ornament ornament-right"></span>
    <span class="ring-ornament ornament-bottom"></span>
    <span class="ring-ornament ornament-left"></span>
</div>

            <!-- ==================================
                 Center Mark
            =================================== -->

            <div class="board-center">

                <div class="board-center-mark"></div>

            </div>



            <!-- ==================================
                 Players
                 Generated by JavaScript
            =================================== -->

            <div
                id="player-ring"
                class="player-ring"
            ></div>


        </div>

<!-- ======================================
     Character Selection
======================================= -->

<div
    id="character-selection"
    class="character-selection hidden"
>

    <div class="character-selection-backdrop"></div>


    <div class="character-selection-panel">


        <!-- ==================================
             Header
        =================================== -->

        <div class="character-selection-header">

            <span class="character-selection-step">
                BUILD THE BAG
            </span>

            <h2>
                Select the characters for
                <span id="selection-player-count">
                    12
                </span>
                players
            </h2>

        </div>



        <!-- ==================================
             Character Area
        =================================== -->

        <div class="character-selection-body">


            <!-- ==============================
                 Required Counts
            =============================== -->

            <div
                id="character-requirements"
                class="character-requirements"
            >

                <div
                    class="character-requirement"
                    data-team="Townsfolk"
                >

                    <span class="requirement-symbol"></span>

                    <strong>
                        <span id="townsfolk-selected">0</span>
                        /
                        <span id="townsfolk-required">7</span>
                    </strong>

                </div>


                <div
                    class="character-requirement"
                    data-team="Outsider"
                >

                    <span class="requirement-symbol"></span>

                    <strong>
                        <span id="outsider-selected">0</span>
                        /
                        <span id="outsider-required">2</span>
                    </strong>

                </div>


                <div
                    class="character-requirement"
                    data-team="Minion"
                >

                    <span class="requirement-symbol"></span>

                    <strong>
                        <span id="minion-selected">0</span>
                        /
                        <span id="minion-required">2</span>
                    </strong>

                </div>


                <div
                    class="character-requirement"
                    data-team="Demon"
                >

                    <span class="requirement-symbol"></span>

                    <strong>
                        <span id="demon-selected">0</span>
                        /
                        <span id="demon-required">1</span>
                    </strong>

                </div>

            </div>



            <!-- ==============================
                 Characters
            =============================== -->

            <div
                id="character-grid"
                class="character-grid"
            ></div>


        </div>



        <!-- ==================================
             Footer
        =================================== -->

        <div class="character-selection-footer">

            <div
                id="selection-total"
                class="selection-total"
            >
                0 / 12 selected
            </div>


            <div class="character-selection-actions">

                <button
                    id="cancel-character-selection"
                    class="character-selection-cancel"
                    type="button"
                >
                    Cancel
                </button>


                <button
                    id="distribute-characters"
                    class="character-selection-distribute"
                    type="button"
                >
                    Distribute Tokens
                </button>

            </div>

        </div>


    </div>

</div>

        <!-- ======================================
             Status
        ======================================= -->

        <div class="trainer-status">

            <div class="trainer-status-row">

                <span class="status-icon">
                    ●
                </span>

                <strong id="player-count">
                    12 players
                </strong>

            </div>


            <div class="trainer-status-row">

                <span class="status-icon">
                    ◇
                </span>

                <span id="selection-status">
                    No characters selected
                </span>

            </div>

        </div>



        <!-- ======================================
             Main Action
        ======================================= -->

        <button
            id="select-characters"
            class="trainer-main-action"
            type="button"
        >

            <span class="trainer-main-action-icon">
                ◆
            </span>

            <span>
                Select Characters
            </span>

        </button>


    </section>


</main>



<script src="/js/sidebar.js"></script>
<script src="/js/storyteller-trainer.js"></script>


</body>

</html>
