<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Storyteller Trainer | Clockipedia
    </title>

    <link
        rel="stylesheet"
        href="/css/style-global.css"
    >

    <link
        rel="stylesheet"
        href="/css/storyteller-trainer.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>


<body>


<div id="sidebar-container"></div>


<main class="trainer">


    <!-- ==========================================
         Game Board
    =========================================== -->

    <section class="trainer-board">


        <!-- ======================================
             Title
        ======================================= -->

        <header class="trainer-title">

            <span class="trainer-title-small">
                TROUBLE BREWING
            </span>

            <h1>
                Storyteller Trainer
            </h1>

            <span
                id="trainer-instruction"
                class="trainer-instruction"
            >
                Select characters to begin
            </span>

        </header>



        <!-- ======================================
             Phase
        ======================================= -->

        <div class="trainer-phase">

            <span
                id="phase-number"
                class="phase-number"
            >
                SETUP
            </span>

            <strong
                id="phase-name"
                class="phase-name"
            >
                Select Characters
            </strong>

        </div>



        <!-- ======================================
             Player Area
        ======================================= -->

        <div
            id="player-area"
            class="player-area"
        >


            <!-- ==================================
                 Decorative Rings
            =================================== -->

            <div class="board-ring board-ring-outer"></div>

            <div class="board-ring board-ring-middle"></div>

            <div class="board-ring board-ring-inner"></div>



            <!-- ==================================
                 Center Mark
            =================================== -->

            <div class="board-center">

                <div class="board-center-mark"></div>

            </div>



            <!-- ==================================
                 Players
                 Generated by JavaScript
            =================================== -->

            <div
                id="player-ring"
                class="player-ring"
            ></div>


        </div>



        <!-- ======================================
             Status
        ======================================= -->

        <div class="trainer-status">

            <div class="trainer-status-row">

                <span class="status-icon">
                    ●
                </span>

                <strong id="player-count">
                    12 players
                </strong>

            </div>


            <div class="trainer-status-row">

                <span class="status-icon">
                    ◇
                </span>

                <span id="selection-status">
                    No characters selected
                </span>

            </div>

        </div>



        <!-- ======================================
             Main Action
        ======================================= -->

        <button
            id="select-characters"
            class="trainer-main-action"
            type="button"
        >

            <span class="trainer-main-action-icon">
                ◆
            </span>

            <span>
                Select Characters
            </span>

        </button>


    </section>


</main>



<script src="/js/sidebar.js"></script>
<script src="/js/storyteller-trainer.js"></script>


</body>

</html>
