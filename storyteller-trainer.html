<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Storyteller Trainer | Clockipedia
    </title>

    <link
        rel="stylesheet"
        href="/css/style-global.css"
    >

    <link
        rel="stylesheet"
        href="/css/storyteller-trainer.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>


<body>


<div id="sidebar-container"></div>


<main class="trainer-page">


    <!-- ==========================================
         Header
    =========================================== -->

    <header class="trainer-header">

        <div>

            <span class="trainer-eyebrow">
                TROUBLE BREWING
            </span>

            <h1>
                Storyteller Trainer
            </h1>

        </div>


        <div class="trainer-phase">

            <span class="phase-label">
                SETUP
            </span>

            <span class="phase-name">
                Select Characters
            </span>

        </div>

    </header>



    <!-- ==========================================
         Game Workspace
    =========================================== -->

    <section
        id="trainer-game"
        class="trainer-game"
    >


        <!-- ======================================
             Town Square
        ======================================= -->

        <div
            id="town-square"
            class="town-square"
        >


            <div
                id="player-ring"
                class="player-ring"
            ></div>


            <div class="town-square-center">

                <span class="town-square-small">
                    CLOCKIPEDIA
                </span>

                <strong>
                    Town Square
                </strong>

            </div>


        </div>



        <!-- ======================================
             Setup Button
        ======================================= -->

        <button
            id="open-character-selection"
            class="setup-action-button"
            type="button"
        >
            Select Characters
        </button>



        <!-- ======================================
             Character Selection Overlay
        ======================================= -->

        <div
            id="character-selection"
            class="character-selection-overlay hidden"
        >


            <div class="character-selection-window">


                <!-- ==============================
                     Selection Title
                =============================== -->

                <div class="character-selection-title">

                    Select the characters for

                    <strong id="selection-player-count">
                        12
                    </strong>

                    players

                </div>



                <!-- ==============================
                     Selection Content
                =============================== -->

                <div class="character-selection-content">


                    <!-- Required Counts -->

                    <div
                        id="setup-requirements"
                        class="setup-requirements"
                    ></div>



                    <!-- Character Tokens -->

                    <div
                        id="character-groups"
                        class="character-grid"
                    ></div>


                </div>



                <!-- ==============================
                     Selection Footer
                =============================== -->

                <div class="character-selection-footer">


                    <span
                        id="selection-total"
                        class="selection-total"
                    >
                        0 / 12 selected
                    </span>


                    <button
                        id="distribute-tokens"
                        class="primary-button"
                        type="button"
                        disabled
                    >
                        Distribute Tokens
                    </button>


                    <button
                        id="close-character-selection"
                        class="secondary-button"
                        type="button"
                    >
                        Cancel
                    </button>


                </div>


            </div>


        </div>


    </section>


</main>



<script src="/js/sidebar.js"></script>
<script src="/js/storyteller-trainer.js"></script>


</body>

</html>
