<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
<body>
<div id="sidebar"></div>
<main id="content">
<div class="homepage">
    <!-- HERO SECTION -->
    <section class="hero-section">
        <img 
            class="hero-logo"
            src="/images/clockipedia-logo.png"
            alt="Clockipedia"
        >
        <p class="hero-description">
            A fan-made Blood on the Clocktower resource
        </p>
        <div class="hero-links">
            <a href="/characters.html">
                Characters
            </a>
            <a href="/scripts.html">
                Scripts
            </a>
            <a href="/interactions.html">
                Interactions
            </a>
        </div>
    </section>
<section class="character-feature">
    <div id="characterToken">
        <div class="token-circle">
            <img
                id="tokenImage"
                src=""
                alt=""
            >
        </div>
        <div
            id="tokenName"
            class="token-name"
        >
            Character
        </div>
    </div>
    <div
        id="interactionCard"
        class="interaction-card"
    >
        <h2 id="interactionCharacter">
            Character
        </h2>
        <p id="interactionTeam">
            Team
        </p>
        <hr>
        <p id="interactionAbility">
            Ability
        </p>
        <hr>
        <div id="interactionFact">
            Did you know...
        </div>
    </div>
</section>
</div>
</main>
<script src="/js/characters.js"></script>
<script src="/js/tooltip.js"></script>
<script src="js/search.js"></script>
<script src="js/sidebar.js"></script>
<script src="/js/homepage.js"></script>
</body>
