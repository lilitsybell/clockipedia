<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clockipedia</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/images/favicon.png">
</head>
<body>
<div id="sidebar"></div>
<main id="content">
<div class="homepage">
    <!-- HERO SECTION -->
    <section class="hero-section">
        <img 
            class="hero-logo"
            src="/images/clockipedia-logo.png"
            alt="Clockipedia"
        >
        <p class="hero-description">
            A fan-made Blood on the Clocktower resource
        </p>
        <div class="hero-links">
            <a href="/characters.html">
                Characters
            </a>
            <a href="/scripts.html">
                Scripts
            </a>
            <a href="/interactions.html">
                Interactions
            </a>
        </div>
    </section>
<section class="character-feature">
    <div id="characterToken" class="character-token">
        <div class="token-circle">
            <div class="token-face">
                <img
                    id="tokenImage"
                    src=""
                    alt=""
                >
            </div>
            <svg id="tokenName" class="token-name" viewBox="0 0 280 280">
                <defs>
                    <path 
                        id="tokenTextCurve"
                        d="M30,155 A95,95 0 0,1 190,155"
                    />
                </defs>
                <text text-anchor="middle">
                    <textPath 
                        href="#tokenTextCurve"
                        startOffset="50%"
                    >
                        Character
                    </textPath>
                </text>
            </svg>
        </div>
    </div>
    <div id="interactionCard" class="home-interaction-card">
        <div class="interaction-title">
            <h2 id="interactionCharacter"></h2>
            <span id="interactionTeam"></span>
        </div>
        <div class="interaction-ability">
            <p id="interactionAbility"></p>
        </div>
        <div class="interaction-fact">
            <strong>Did you know?</strong>
            <p id="interactionFact"></p>
        </div>
    </div>
</section>
<section class="homepage-card daily-script">
    <h2>
        Script of the Day
    </h2>
    <div id="dailyScript"></div>
</section>
</div>
</main>
<script src="/js/characters.js"></script>
<script src="/js/interaction-card.js"></script>
<script src="/js/tooltip.js"></script>
<script src="/js/search.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/homepage.js"></script>
</body>
