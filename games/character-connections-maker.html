<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Make Your Own Character Connections | Clockipedia
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/connections.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>

<body>

    <div id="sidebar"></div>

    <main id="content">

        <div class="s-page">

            <section class="s-header">

                <span class="s-eyebrow">
                    Clockipedia Games
                </span>

                <h1>
                    Make Your Own Character Connections
                </h1>

                <p>
                    Create four groups of four Blood on the Clocktower
                    characters, then share your puzzle with friends.
                </p>

            </section>

            <section class="connections-maker">

                <div class="connections-maker-intro">

                    <h2>
                        Create Your Puzzle
                    </h2>

                    <p>
                        Each group needs a category name and four unique
                        characters.
                    </p>

                </div>

                <div
                    id="connectionsMakerGroups"
                    class="connections-maker-groups"
                >

<section
    class="connections-maker-group"
    data-color="yellow"
>
    <div class="connections-maker-group-header">
        <span class="connections-maker-color"></span>
        <span>Easy</span>
    </div>

                        <input
                            type="text"
                            class="connections-maker-category"
                            placeholder="Category name"
                        >

                        <div class="connections-maker-slots">

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                        </div>

                    </section>


<section
    class="connections-maker-group"
    data-color="green"
>
    <div class="connections-maker-group-header">
        <span class="connections-maker-color"></span>
        <span>Medium</span>
    </div>

                        <input
                            type="text"
                            class="connections-maker-category"
                            placeholder="Category name"
                        >

                        <div class="connections-maker-slots">

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                        </div>

                    </section>


<section
    class="connections-maker-group"
    data-color="blue"
>
    <div class="connections-maker-group-header">
        <span class="connections-maker-color"></span>
        <span>Hard</span>
    </div>

                        <input
                            type="text"
                            class="connections-maker-category"
                            placeholder="Category name"
                        >

                        <div class="connections-maker-slots">

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                        </div>

                    </section>


<section
    class="connections-maker-group"
    data-color="purple"
>
    <div class="connections-maker-group-header">
        <span class="connections-maker-color"></span>
        <span>Expert</span>
    </div>

                        <input
                            type="text"
                            class="connections-maker-category"
                            placeholder="Category name"
                        >

                        <div class="connections-maker-slots">

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                            <button type="button">
                                Choose Character
                            </button>

                        </div>

                    </section>

                </div>
<div class="connections-maker-footer">

    <div class="connections-maker-author">

        <label for="connectionsMakerAuthor">
            Your Name
        </label>

        <input
            id="connectionsMakerAuthor"
            type="text"
            placeholder="Optional"
        >

    </div>

    <button
        id="connectionsMakerCreate"
        class="connections-maker-create"
        type="button"
    >
        Create Puzzle
    </button>

</div>

<div
    id="connectionsMakerMessage"
    class="connections-maker-message"
    hidden
></div>

<div
    id="connectionsMakerShare"
    class="connections-maker-share"
    hidden
>

    <label for="connectionsMakerShareURL">
        Share Link
    </label>

    <div class="connections-maker-share-row">

        <input
            id="connectionsMakerShareURL"
            type="text"
            readonly
        >

        <button
            id="connectionsMakerCopy"
            type="button"
        >
            Copy Link
        </button>

    </div>

</div>
            </section>

        </div>
<div
    id="connectionsCharacterPicker"
    class="connections-character-picker"
    hidden
>

    <div class="connections-character-picker-backdrop"></div>

    <section class="connections-character-picker-panel">

        <header class="connections-character-picker-header">

            <div>

                <span class="s-eyebrow">
                    Choose Character
                </span>

                <h2>
                    Select a Character
                </h2>

            </div>

            <button
                id="connectionsCharacterPickerClose"
                class="connections-character-picker-close"
                type="button"
                aria-label="Close character picker"
            >
                ×
            </button>

        </header>

        <input
            id="connectionsCharacterSearch"
            class="connections-character-search"
            type="text"
            placeholder="Search characters..."
            autocomplete="off"
        >

        <div
            id="connectionsCharacterPickerGrid"
            class="connections-character-picker-grid"
        ></div>

    </section>

</div>
    </main>

    <script src="/js/characters.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/connections-maker.js"></script>

</body>
</html>
