<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Can You Name Every Character? | Clockipedia
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/can-you-name-every-character.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>

<body>

    <div id="sidebar"></div>

    <main id="content">

        <div class="name-every-character-page">

            <section class="name-every-character-header">

                <span class="name-every-character-eyebrow">
                    Clockipedia Games
                </span>

                <h1>
                    Can You Name Every Character?
                </h1>

                <p>
                    Try to name every Blood on the Clocktower character.
                </p>

            </section>
<section class="name-every-character-controls">

    <input
        type="text"
        id="nameEveryCharacterInput"
        class="name-every-character-input"
        placeholder="Type a character name..."
        autocomplete="off"
        spellcheck="false"
    >

    <div
        id="nameEveryCharacterProgress"
        class="name-every-character-progress"
    >
        0 / 0
    </div>
    <div
    id="nameEveryCharacterComplete"
    class="name-every-character-complete"
    hidden
>
    You named them all!
</div>
    <button
    id="nameEveryCharacterGiveUp"
    class="name-every-character-give-up"
    type="button"
>
    Give Up
</button>

</section>

            <section
                id="nameEveryCharacterBoard"
                class="name-every-character-board"
            ></section>

        </div>

    </main>


    <script src="/js/characters.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/sidebar.js"></script>

    <script src="/js/can-you-name-every-character.js"></script>

</body>

</html>
