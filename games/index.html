<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Games | Clockipedia
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/games.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>


<body>


    <div id="sidebar"></div>


    <main id="content">

        <div class="games-page">


            <!-- =================================
                 Header
            ================================== -->

<section class="games-header">

    <span class="games-eyebrow">
        Clockipedia
    </span>

    <h1>
        Games
    </h1>

    <p>
        Play Blood on the Clocktower puzzles, quizzes,
        and daily challenges.
    </p>

</section>
            <!-- =================================
                 Game Grid
            ================================== -->

<section class="games-grid">

    <a
        href="/games/character-connections.html"
        class="game-card game-card-featured"
    >

        <div class="game-card-top">

            <span class="game-card-status">
                Daily Game
            </span>

        </div>

        <div class="game-card-content">

            <h2>
                Character Connections
            </h2>

            <p>
                Sort sixteen characters into four groups
                based on what connects them.
            </p>

        </div>

        <span class="game-card-action">
            Play →
        </span>

    </a>

</section>

        </div>

    </main>


    <script src="/js/characters.js"></script>
    <script src="/js/tooltip.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/sidebar.js"></script>


</body>

</html>
