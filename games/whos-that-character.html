<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Who's That Character? | Clockipedia
    </title>

    <link rel="stylesheet" href="/css/style-global.css">
    <link rel="stylesheet" href="/css/whos-that-character.css">
    <link rel="icon" type="image/png" href="/images/favicon.png">

</head>

<body>

    <div id="sidebar"></div>

    <main id="content">

        <div class="site-page">

<section class="site-header">

    <span class="site-eyebrow">
        Clockipedia Games
    </span>

    <h1>
        Who's That Character?
    </h1>

    <p>
        Can you identify the character from their silhouette?
    </p>

<div class="whos-that-character-header-bottom">

    <div class="whos-that-character-puzzle-details">

        <span id="whosThatCharacterPuzzleNumber">
            Puzzle #1
        </span>

        <span class="whos-that-character-meta-divider">
            •
        </span>

        <span id="whosThatCharacterPuzzleDate">
        </span>

    </div>


    <div class="whos-that-character-header-actions">

        <button
            id="whosThatCharacterArchiveButton"
            class="site-button-secondary whos-that-character-archive-button"
            type="button"
        >
            Archive
        </button>

    </div>

</div>

</section>


            <section class="site-card whos-that-character-game">
<div class="whos-that-character-status">

    <div class="whos-that-character-status-item">

        <span class="whos-that-character-status-label">
            Character
        </span>

        <strong id="whosThatCharacterProgress">
            1 / 10
        </strong>

    </div>


    <div class="whos-that-character-status-item">

        <span class="whos-that-character-status-label">
            Tries Remaining
        </span>

        <strong id="whosThatCharacterTries">
            3
        </strong>

    </div>


    <div class="whos-that-character-status-item">

        <span class="whos-that-character-status-label">
            Score
        </span>

        <strong id="whosThatCharacterScore">
            0 / 30
        </strong>

    </div>

</div>
<div class="whos-that-character-image-card">

    <div class="whos-that-character-rays"></div>

    <div
        id="whosThatCharacterSilhouette"
        class="whos-that-character-silhouette"
    ></div>

    <img
        id="whosThatCharacterReveal"
        class="whos-that-character-reveal"
        src=""
        alt=""
    >

</div>


                <div class="whos-that-character-answer-area">

                    <input
                        type="text"
                        id="whosThatCharacterInput"
                        class="site-input whos-that-character-input"
                        placeholder="Type a character name..."
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <button
                        id="whosThatCharacterGuess"
                        class="site-button-secondary whos-that-character-guess"
                        type="button"
                    >
                        Guess
                    </button>

                </div>


                <div
                    id="whosThatCharacterMessage"
                    class="whos-that-character-message"
                ></div>

            </section>

        </div>
<div
    id="whosThatCharacterArchiveModal"
    class="daily-archive-modal"
    hidden
>

    <div class="daily-archive-backdrop"></div>

    <section
        class="daily-archive-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="whosThatCharacterArchiveTitle"
    >

        <header class="daily-archive-header">

            <div>

                <span class="site-eyebrow">
                    Who's That Character?
                </span>

                <h2 id="whosThatCharacterArchiveTitle">
                    Puzzle Archive
                </h2>

                <p>
                    Play previous daily puzzles and
                    revisit your results.
                </p>

            </div>

            <button
                id="whosThatCharacterArchiveClose"
                class="daily-archive-close"
                type="button"
                aria-label="Close archive"
            >
                ×
            </button>

        </header>


        <div class="daily-calendar-nav">

            <button
                id="whosThatCharacterArchivePrevious"
                type="button"
                aria-label="Previous month"
            >
                ‹
            </button>

            <h3 id="whosThatCharacterArchiveMonth"></h3>

            <button
                id="whosThatCharacterArchiveNext"
                type="button"
                aria-label="Next month"
            >
                ›
            </button>

        </div>


        <div class="daily-calendar-weekdays">

            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>

        </div>


        <div
            id="whosThatCharacterArchiveCalendar"
            class="daily-calendar"
        >
        </div>


        <div class="daily-archive-footer">

            <button
                id="whosThatCharacterArchiveToday"
                class="daily-archive-today"
                type="button"
            >
                Today's Puzzle
            </button>

        </div>

    </section>

</div>
    </main>


    <script src="/js/characters.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/sidebar.js"></script>

    <script src="/js/whos-that-character.js"></script>

</body>

</html>
