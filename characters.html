<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Characters</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/images/favicon.png">
</head>
<div id="sidebar"></div>
<main id="content">
    <div class="character-library">
        <div class="character-library-header">
            <h1>Characters</h1>
            <p>
                Explore the complete Clockipedia character library.
            </p>
        </div>
        <div id="characterDirectory"></div>
        <div class="character-library-controls">
            <div class="character-search-wrapper">
                <input
                    type="text"
                    id="characterLibrarySearch"
                    placeholder="Search characters..."
                    autocomplete="off"
                >
            </div>
            <div class="character-sort">
                <label for="characterSort">
                    Sort by:
                </label>
                <select id="characterSort">
                    <option value="team">Team</option>
                    <option value="alphabetical">Alphabetical</option>
                    <option value="edition">Edition</option>
                </select>
            </div>
        </div>
        <div
            id="characterTeamFilters"
            class="character-team-filters">
            <button data-team="all" class="active">
                All
            </button>
            <button data-team="Townsfolk">
                Townsfolk
            </button>
            <button data-team="Outsiders">
                Outsiders
            </button>
            <button data-team="Minions">
                Minions
            </button>
            <button data-team="Demons">
                Demons
            </button>
            <button data-team="Loric">
                Loric
            </button>
            <button data-team="Fabled">
                Fabled
            </button>
        </div>
        <div id="characterLibrary">
            <!-- Characters will be generated here -->
        </div>
    </div>
</main>
<body>
<script src="/js/characters.js"></script>
<script src="/js/tooltip.js"></script>
<script src="/js/search.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/characters-library.js"></script>
<script src="/js/characters-page.js"></script>
</body>
</html>
