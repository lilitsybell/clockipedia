<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="../images/favicon.png">
<meta charset="UTF-8">
<title>Script Generator</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar"></div>
<div id="content">
<div class="script-generator">
    <!-- TITLE -->
    <div class="generator-header">
        Script Generator
    </div>
    <!-- SETTINGS PANEL -->
    <div class="generator-panel">
        <div class="generator-controls">
            <div class="generator-setting">
                <label>
                Include Character
                </label>
                <input placeholder="Search characters...">
            </div>
            <div class="generator-setting">
                <label>
                Homebrew
                </label>
                <button class="generator-button">
                Maybe
                </button>
            </div>
            <div class="generator-setting">
                <label>
                Script Size
                </label>
                <button class="generator-button">
                Any
                </button>
            </div>
            <button class="generator-button">
            Generate Script
            </button>
        </div>
    </div>
<!-- RESULTS PANEL -->
<div class="generator-panel script-results">
    <div class="script-header">
        <div class="script-header-info">
            <div class="script-heading">
                <h2 id="scriptTitle">
                    Unknown Script
                </h2>
                <span id="scriptAuthor">
                    by Unknown
                </span>
            </div>
            <div id="scriptTags"></div>
        </div>
        <div class="json-buttons">
            <button class="generator-button">
                Copy JSON
            </button>
            <button class="generator-button">
                Download JSON
            </button>
        </div>
    </div>
    <!-- SCRIPT DESCRIPTION -->
    <div id="descriptionBox" style="display:none;">
        <h3>
            Description
        </h3>
        <p id="scriptDescription"></p>
    </div>
    <!-- CHARACTERS -->
    <div id="characterContainer">
        Loading random script...
    </div>
</div>
</div>
</div>
<script src="/js/characters.js"></script>
<script src="/js/interaction-card.js"></script>
<script src="/js/tooltip.js"></script>
<script src="../js/search.js"></script>
<script src="../js/sidebar.js"></script>
</body>
</html>
