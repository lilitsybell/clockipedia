<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Character</title>

<link rel="stylesheet" href="/css/character.css">

</head>

<body>

<div class="wiki">

    <div class="character-header">

        <img id="characterImage">

        <div>
            <h1 id="characterName"></h1>
            <h3 id="characterTeam"></h3>
        </div>

    </div>


    <div class="tabs">

        <div class="tab active" onclick="showPage(0)">
            Overview
        </div>

        <div class="tab" onclick="showPage(1)">
            How to Run
        </div>

        <div class="tab" onclick="showPage(2)">
            Examples
        </div>

    </div>


    <div class="content">


        <div class="page active">

            <div class="example">
                <i id="flavor"></i>
            </div>


            <h2>Purpose</h2>

            <div id="purpose"></div>


            <h2>Summary</h2>

            <ul id="summary"></ul>


        </div>



        <div class="page">

            <h2>How to Run</h2>

            <div id="run"></div>

        </div>



        <div class="page">

            <h2>Examples</h2>

            <div id="examples"></div>

        </div>


    </div>


</div>


<script src="/scripts/character-page.js"></script>

</body>
</html>
