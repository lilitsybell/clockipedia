<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Games | Clockipedia
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/games.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>


<body>


    <div id="sidebar"></div>


    <main id="content">

        <div class="games-page">


            <!-- =================================
                 Header
            ================================== -->

<section class="games-header">

    <span class="games-eyebrow">
        Clockipedia
    </span>

    <h1>
        Games
    </h1>

    <p>
        Play Blood on the Clocktower puzzles, quizzes,
        and daily challenges.
    </p>

</section>
            <!-- =================================
                 Game Grid
            ================================== -->

<section class="games-grid">

<a
    href="/games/character-connections.html"
    class="game-card game-card-connections"
>

    <div class="game-card-connections-art">

        <span class="connections-art-square square-one"></span>
        <span class="connections-art-square square-two"></span>
        <span class="connections-art-square square-three"></span>
        <span class="connections-art-square square-four"></span>

        <div class="connections-card-mini-board">

            <span data-color="yellow"></span>
            <span data-color="yellow"></span>
            <span data-color="green"></span>
            <span data-color="purple"></span>

            <span data-color="blue"></span>
            <span data-color="green"></span>
            <span data-color="blue"></span>
            <span data-color="yellow"></span>

            <span data-color="purple"></span>
            <span data-color="blue"></span>
            <span data-color="green"></span>
            <span data-color="purple"></span>

            <span data-color="green"></span>
            <span data-color="yellow"></span>
            <span data-color="purple"></span>
            <span data-color="blue"></span>

        </div>

    </div>


    <div class="game-card-connections-content">

        <span class="game-card-status">
            Daily Game
        </span>

        <h2>
            Character Connections
        </h2>

        <p>
            Sort sixteen Blood on the Clocktower characters
            into four groups based on what connects them.
        </p>

        <div class="game-card-buttons">

            <span class="game-card-play">
                Play Today's Puzzle →
            </span>

            <div class="game-card-or">
                <span></span>
                <strong>or</strong>
                <span></span>
            </div>

            <span
                class="game-card-make"
                data-link="/games/connections-maker.html"
            >
                Make Your Own →
            </span>

        </div>

    </div>

</a>

</section>

        </div>

    </main>


    <script src="/js/characters.js"></script>
    <script src="/js/tooltip.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/sidebar.js"></script>


</body>

</html>
