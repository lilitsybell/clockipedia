<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Erratanomicon Legacy | Corey & Bell
    </title>

    <link
        rel="stylesheet"
        href="/css/style-global.css"
    >

    <link
        rel="stylesheet"
        href="/coreyandbell/css/erratanomicon-legacy.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>


<body>


<!-- ==========================================
     Sidebar
========================================== -->

<div id="sidebar"></div>


<!-- ==========================================
     Main Content
========================================== -->

<div id="content">

    <main class="site-page erratanomicon-page">


        <!-- ==================================
             Header
        =================================== -->

        <header class="site-header erratanomicon-header">

            <span class="site-eyebrow">
                COREY & BELL
            </span>

            <h1>
                Erratanomicon Legacy
            </h1>

            <p>
                A living Blood on the Clocktower script.
                Edit character abilities as the game changes
                them, then download the finished script.
            </p>

        </header>


        <!-- ==================================
             Script Controls
        =================================== -->

<div class="erratanomicon-script-controls">

    <input
        id="importErratanomiconFile"
        type="file"
        accept=".json,application/json"
        hidden
    >

    <button
        id="importErratanomiconScript"
        class="site-button"
        type="button"
    >
        Import Script
    </button>

    <button
        id="downloadErratanomiconScript"
        class="site-button"
        type="button"
    >
        Download Script
    </button>

</div>


        <!-- ==================================
             Script
        =================================== -->

        <section
            id="erratanomiconScript"
            class="erratanomicon-script"
        >

            <div class="erratanomicon-loading">
                Loading script...
            </div>

        </section>


        <!-- ==================================
             Character Graveyard
        =================================== -->

        <section
            id="erratanomiconGraveyard"
            class="erratanomicon-graveyard"
        >

            <div class="erratanomicon-graveyard-heading">

                <span class="site-eyebrow">
                    LEGACY
                </span>

                <h2>
                    Character Graveyard
                </h2>

                <p>
                    Characters that have been permanently
                    removed from the legacy.
                </p>

            </div>

            <div
                id="erratanomiconGraveyardCharacters"
                class="erratanomicon-graveyard-characters"
            ></div>

        </section>


    </main>

</div>


<!-- ==========================================
     Scripts
========================================== -->

<script src="/js/sidebar.js"></script>

<script
    src="/coreyandbell/js/erratanomicon-legacy.js"
></script>


</body>

</html>
