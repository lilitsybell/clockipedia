<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Video Popup Maker | Corey & Bell
    </title>

    <link
        rel="stylesheet"
        href="/css/style-global.css"
    >

    <link
        rel="stylesheet"
        href="/coreyandbell/css/video-popup-maker.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

</head>


<body>


<main class="popup-maker-page">


    <!-- ==========================================
         Header
    =========================================== -->

    <header class="popup-maker-header">

        <span class="site-eyebrow">
            COREY & BELL
        </span>

        <h1>
            Video Popup Maker
        </h1>

        <p>
            Create character information cards
            for video overlays.
        </p>

    </header>



    <!-- ==========================================
         Workspace
    =========================================== -->

    <div class="popup-maker-workspace">


        <!-- ======================================
             Editor
        ======================================= -->

        <section class="popup-editor">

            <div class="popup-editor-header">

                <h2>
                    Popup
                </h2>

            </div>


            <!-- Player -->

            <div class="popup-field">

                <label for="popupPlayer">
                    Player Name
                </label>

                <input
                    id="popupPlayer"
                    type="text"
                    value="Pear"
                >

            </div>


            <!-- Character -->

            <div class="popup-field">

                <label for="popupCharacter">
                    Character
                </label>

                <select id="popupCharacter">

                    <option value="">
                        Loading characters...
                    </option>

                </select>

            </div>


            <!-- Custom Icon -->

            <div class="popup-field">

                <label for="popupCustomIcon">
                    Custom Character Icon URL
                </label>

                <input
                    id="popupCustomIcon"
                    type="url"
                    placeholder="Optional"
                >

                <span class="popup-field-note">
                    Leave blank to use the normal
                    character icon.
                </span>

            </div>


            <!-- Ability -->

            <div class="popup-field">

                <label for="popupAbility">
                    Ability
                </label>

                <textarea
                    id="popupAbility"
                    rows="4"
                ></textarea>

            </div>


            <!-- Information -->

<div class="popup-editor-section">

    <div class="popup-editor-section-header">

        <h3>
            Information
        </h3>

        <button
            id="addInformationSection"
            class="popup-small-button"
            type="button"
        >
            + Add Section
        </button>

    </div>


    <div id="popupInformationSections">


        <!-- ==================================
             Information Section
        =================================== -->

        <div class="popup-information-section">

            <div class="popup-information-section-header">

                <input
                    class="popup-info-heading"
                    type="text"
                    value="FIRST NIGHT"
                    placeholder="Heading"
                >

                <button
                    class="popup-remove-section"
                    type="button"
                    aria-label="Remove section"
                >
                    ×
                </button>

            </div>


            <div class="popup-information-rows">

                <div class="popup-information-row">

                    <input
                        class="popup-information-text"
                        type="text"
                        value="Corey, alexie, Reece [Drunk]"
                    >

                    <button
                        class="popup-remove-information"
                        type="button"
                        aria-label="Remove information"
                    >
                        ×
                    </button>

                </div>

            </div>


            <button
                class="popup-add-information"
                type="button"
            >
                + Add Row
            </button>

        </div>


    </div>

</div>

        </section>



<!-- ======================================
     Preview
======================================= -->

<section class="popup-preview-area">

    <div class="popup-preview-label">
        PREVIEW
    </div>


    <div
        id="popupPreview"
        class="video-popup-card"
    >


        <!-- ==================================
             Character Header
        =================================== -->

        <div class="video-popup-top">


            <!-- Character Icon -->

            <div class="video-popup-character">

                <img
                    id="previewCharacterIcon"
                    src=""
                    alt=""
                >

            </div>


            <!-- Character Information -->

            <div class="video-popup-character-content">

                <div class="video-popup-title">

                    <span id="previewPlayer">
                        Pear
                    </span>

                    <span class="video-popup-character-name">
                        Noble
                    </span>

                </div>


                <div
                    id="previewAbility"
                    class="video-popup-ability"
                ></div>

            </div>


        </div>


        <!-- ==================================
             Divider
        =================================== -->

        <div class="video-popup-divider"></div>


        <!-- ==================================
             Learned Information
        =================================== -->

        <div class="video-popup-information">

            <div id="previewInformation"></div>

        </div>


    </div>

</section>


    </div>


</main>


<script
    src="/coreyandbell/js/video-popup-maker.js"
></script>


</body>

</html>
